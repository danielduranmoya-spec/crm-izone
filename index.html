<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f4f6" media="(prefers-color-scheme: light)">
<title>CRM Bodas IZONE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: barra lateral de cristal + área de trabajo; en móvil, barra inferior con botón central "Añadir boda". Fondo con manchas magenta difuminadas bajo paneles liquid glass. */
:root{
  --bg:#f7f4f6;
  --ink:#121012;
  --ink-2:#4b4249;
  --muted:#857a82;
  --accent:#b9006b;
  --accent-ink:#ffffff;
  --accent-soft:rgba(185,0,107,.10);
  --blob-1:rgba(214,51,141,.55);
  --blob-2:rgba(255,170,214,.75);
  --blob-3:rgba(190,170,255,.45);
  --glass:rgba(255,255,255,.52);
  --glass-strong:rgba(255,255,255,.74);
  --glass-line:rgba(255,255,255,.85);
  --glass-hi:rgba(255,255,255,.95);
  --line:rgba(40,10,30,.10);
  --field:rgba(255,255,255,.62);
  --shadow:rgba(80,10,50,.18);
  --paper:#ffffff;
  --paper-ink:#151215;
  --ok:#11795a; --ok-soft:rgba(17,121,90,.12);
  --warn:#a35a00; --warn-soft:rgba(214,130,0,.14);
  --bad:#c0262d; --bad-soft:rgba(192,38,45,.11);
  --f-display:"Doto", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-body:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0a0c; --ink:#f6eff4; --ink-2:#cdbfc8; --muted:#97899276;
  --muted:#9a8c95; --accent:#ec4fa4; --accent-ink:#1a0711; --accent-soft:rgba(236,79,164,.16);
  --blob-1:rgba(185,0,107,.50); --blob-2:rgba(120,20,80,.55); --blob-3:rgba(80,50,150,.40);
  --glass:rgba(32,22,29,.52); --glass-strong:rgba(38,26,34,.82); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.10); --field:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
  --paper:#1b1418; --paper-ink:#f3ebf0;
  --ok:#4fd1a1; --ok-soft:rgba(79,209,161,.14); --warn:#f2b350; --warn-soft:rgba(242,179,80,.15); --bad:#ff7a80; --bad-soft:rgba(255,122,128,.14);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d0a0c; --ink:#f6eff4; --ink-2:#cdbfc8;
  --muted:#9a8c95; --accent:#ec4fa4; --accent-ink:#1a0711; --accent-soft:rgba(236,79,164,.16);
  --blob-1:rgba(185,0,107,.50); --blob-2:rgba(120,20,80,.55); --blob-3:rgba(80,50,150,.40);
  --glass:rgba(32,22,29,.52); --glass-strong:rgba(38,26,34,.82); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.10); --field:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.55);
  --paper:#1b1418; --paper-ink:#f3ebf0;
  --ok:#4fd1a1; --ok-soft:rgba(79,209,161,.14); --warn:#f2b350; --warn-soft:rgba(242,179,80,.15); --bad:#ff7a80; --bad-soft:rgba(255,122,128,.14);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
select option,select optgroup{background-color:var(--paper);color:var(--paper-ink)}
select option:checked{background-color:var(--accent);color:#fff}
select option:disabled{color:var(--muted)}
.disp-alerta{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin:0;padding:8px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13.5px;font-weight:500}
.disp-resumen{margin:4px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:13.5px}
.disp-grupo h3{font-size:15px;display:flex;gap:8px;align-items:center;margin:0 0 8px}
.disp-grupo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.disp-grupo li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-size:14px}
.disp-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.disp-dot.acc{background:var(--accent)} .disp-dot.bad{background:var(--bad)}
table.disp-cal{border-collapse:separate;border-spacing:2px;width:auto}
table.disp-cal th{padding:4px 2px;text-align:center;font-size:11px;letter-spacing:0;min-width:28px;line-height:1.2;border:0}
table.disp-cal th span{display:block;opacity:.7}
table.disp-cal th.fin{color:var(--ink)} table.disp-cal th.hay{color:var(--accent)} table.disp-cal th.sel{background:var(--accent-soft);border-radius:8px}
table.disp-cal th.pn{text-align:left;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;min-width:150px;padding-right:10px;position:sticky;left:0;background:var(--glass-strong);z-index:1;border-radius:8px}
table.disp-cal th.pn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
table.disp-cal td.dc{padding:0;border:0}
table.disp-cal td.dc button{width:28px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--field);color:#fff;font-size:12px;font-weight:700;cursor:pointer;padding:0}
table.disp-cal td.dc.boda button{background:var(--accent);border-color:transparent}
table.disp-cal td.dc.doble button{background:var(--bad);border-color:transparent}
table.disp-cal td.dc.aus button{background:repeating-linear-gradient(135deg,var(--line) 0 4px,transparent 4px 8px);color:var(--muted)}
table.disp-cal td.dc.sel button{outline:2px solid var(--ink);outline-offset:1px}
.disp-key{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.disp-key.boda{background:var(--accent)} .disp-key.doble{background:var(--bad)} .disp-key.aus{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);border:1px solid var(--line)}
.rowcard.disp-row{grid-template-columns:minmax(0,1.3fr) minmax(140px,1fr) minmax(0,1.1fr) auto}
.rowcard.disp-row.au{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:720px){.rowcard.disp-row{grid-template-columns:1fr 1fr}}
.ficha-lugar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 16px;align-items:end;padding:12px 14px;margin:0 0 14px;border-radius:14px;background:var(--accent-soft);font-size:14px}
.ll-grid{grid-template-columns:minmax(260px,1fr) minmax(0,2fr)}
@media (max-width:900px){.ll-grid{grid-template-columns:1fr}}
.ll-item{width:100%;border:0;font:inherit;color:inherit;cursor:pointer}
.ll-item .t,.ll-item .s{display:block}
.ll-item.sel{background:var(--accent-soft)}
.ll-h{font-size:14px;margin:16px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.reu{padding:14px 16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line)}
.reu-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin-top:10px;font-size:14px}
.reu-datos .wide{grid-column:1/-1}
.reu-gente{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 14px}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;letter-spacing:.04em}
#loc-sug{position:fixed;z-index:200;margin:0;padding:6px;list-style:none;overflow:auto;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -12px var(--shadow)}
#loc-sug li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer}
#loc-sug li small{color:var(--muted);font-size:12.5px;white-space:nowrap}
#loc-sug li:hover,#loc-sug li[aria-selected="true"]{background:var(--accent-soft)}
#loc-sug li b{font-weight:600;color:var(--accent)}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
.tab-num{font-variant-numeric:tabular-nums}

/* fondo */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9}
.blobs i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--blob-1);animation:drift 26s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:18vh;background:var(--blob-2);animation:drift 32s ease-in-out infinite alternate-reverse}
.blobs i:nth-child(3){width:34vmax;height:34vmax;left:30vw;bottom:-18vmax;background:var(--blob-3);animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.blobs i{animation:none}*{transition:none!important}}

/* cristal */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 44px -20px var(--shadow);border-radius:22px}

.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;min-height:100vh;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 32px);display:flex;flex-direction:column;gap:22px;padding:22px 16px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:0 8px;text-decoration:none;color:var(--ink)}
.logo .mark{font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:.02em;line-height:1}
.logo .mark b{color:var(--accent);font-weight:900}
.logo .sub{font-weight:300;font-size:22px;letter-spacing:.06em;line-height:1;margin-top:2px;align-self:flex-end;margin-right:2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--accent-soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 18px -10px var(--shadow)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.dot.local{background:var(--warn)}

main{min-width:0;display:flex;flex-direction:column;gap:18px;padding-bottom:40px}
.top{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 22px}
.top h1{font-size:22px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .mlogo{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--glass-strong);padding:9px 16px;border-radius:999px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chipbtn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -10px var(--accent)}
.btn-primary:hover{filter:brightness(1.07);border-color:transparent}
.btn-sm{padding:6px 12px;font-size:13.5px}
.btn-ghost{background:transparent;box-shadow:none}
.btn-danger{color:var(--bad)}
.btn-danger:hover{border-color:var(--bad)}
.btn svg{width:17px;height:17px}
.iconbtn{width:40px;height:40px;padding:0;position:relative}
.iconbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

.panel{padding:22px}
.panel>h2,.sec-h{font-size:17px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-h .spacer{flex:1}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;letter-spacing:.01em}
.kpi .v.small{font-size:clamp(19px,5.2vw,28px);overflow-wrap:anywhere}
.kpi .l{color:var(--ink-2);font-size:14px}
.kpi.alert .v{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.chip.acc{background:var(--accent);color:var(--accent-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.chipbtn{cursor:pointer;border:1px solid var(--line);background:var(--glass-strong);padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* listas */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13.5px;color:var(--muted)}
.datebox{flex:none;width:58px;text-align:center;border-radius:14px;padding:6px 0;background:var(--glass-strong);border:1px solid var(--line)}
.datebox .d{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1}
.datebox .m{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.datebox .y{font-size:10.5px;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.acc{background:var(--accent)}.sev.ok{background:var(--ok)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 50px -22px var(--shadow)}
.card .names{font-size:18px;font-weight:600;line-height:1.2}
.card .meta{display:flex;gap:8px;flex-wrap:wrap}
.card .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.card .foot b{font-size:17px}

/* formularios */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.wide{grid-column:1/-1}
.f>span{font-size:12.5px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],input[type=datetime-local],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:40px;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input[type=number]{font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex:none;border:1px solid var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.err{color:var(--bad);font-size:13px}

/* tablas editables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{min-height:36px;padding:6px 10px}
.rowcard{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 110px auto;gap:10px;align-items:end;padding:12px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line)}

/* detalle */
.hero{padding:24px;display:flex;flex-wrap:wrap;gap:18px 26px;align-items:center}
.hero .names{font-size:30px;font-weight:600;line-height:1.1}
.hero .count{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;color:var(--accent)}
.hero .grow{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;padding:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:14px;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-hi),0 6px 18px -10px var(--shadow)}
.tabs .n{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 7px;margin-left:4px}

.banner{padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-color:color-mix(in srgb,var(--accent) 45%,var(--glass-line))}
.banner .grow{flex:1;min-width:220px}
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.steps span{padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.steps span.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.steps span.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* documento (presupuesto / contrato) */
.doc{background:var(--paper);color:var(--paper-ink);border-radius:18px;padding:40px 44px;box-shadow:0 30px 60px -30px var(--shadow);border:1px solid var(--line);max-width:860px;width:100%;margin:0 auto}
.doc-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;padding-bottom:20px;border-bottom:2px solid var(--paper-ink);margin-bottom:22px}
.doc-head .logo{padding:0}
.doc h2{font-size:24px;margin-bottom:4px}
.doc h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 8px}
.doc p{margin:0 0 10px;max-width:72ch}
.doc .totals{margin-left:auto;width:min(340px,100%);display:grid;grid-template-columns:1fr auto;gap:6px 18px;margin-top:16px;font-variant-numeric:tabular-nums}
.doc .totals .big{font-size:20px;font-weight:700;border-top:2px solid var(--paper-ink);padding-top:8px}
.doc .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px}
.doc .sign div{border-top:1px solid var(--paper-ink);padding-top:8px;font-size:13px}
.doc td,.doc th{border-color:color-mix(in srgb,var(--paper-ink) 14%,transparent)}
.auto-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px}
.contract-text{white-space:pre-wrap;font-size:14.5px;line-height:1.65}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:16px 18px}
.toolbar .f{min-width:150px}

/* barras */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .track{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--accent);min-width:3px}
.bar .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:2ch;text-align:right}
.bar:hover .fill{filter:brightness(1.12)}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(34px,1fr);gap:6px;align-items:end;height:190px;overflow-x:auto;padding-top:20px}
.months .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--muted)}
.months .colbar{width:70%;max-width:30px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.months .colbar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);font-weight:600}
.stat-big{font-size:20px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));background:rgba(20,5,15,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal .box{width:min(820px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:26px;background:var(--glass-strong);display:flex;flex-direction:column;gap:20px}
.modal .box.small{width:min(440px,100%)}
.modal h2{font-size:22px}
.modal fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.modal legend{font-weight:600;font-size:15px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.modal legend i{font-style:normal;font-family:var(--f-display);font-weight:900;color:var(--accent)}
.modal .foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-26px;padding:14px 0 0;background:linear-gradient(transparent,var(--glass-strong) 30%)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:0 12px 30px -10px var(--shadow);max-width:calc(100vw - 32px)}

.mob{display:none}
.empty{text-align:center;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big{font-family:var(--f-display);font-weight:900;font-size:56px;color:var(--accent);line-height:1}


/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{margin-bottom:6px}
.cal-head span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.day{min-height:104px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.out{opacity:.4;background:transparent}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .dn{font-size:13px;font-weight:600;color:var(--ink-2)}
.day.today .dn{color:var(--accent)}
.calchip,.calseg{display:block;font-size:12px;line-height:1.25;padding:4px 7px;border-radius:8px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.calchip.conf{background:var(--accent);color:var(--accent-ink)}
.calchip.res{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.calchip.done{background:var(--line);color:var(--ink-2)}
.calseg{background:transparent;border:1px dashed var(--line);color:var(--ink-2);font-size:11.5px}
.calchip:hover,.calseg:hover{filter:brightness(1.08)}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.lg.conf{background:var(--accent)}.lg.res{background:var(--warn-soft);border:1px solid var(--warn)}.lg.done{background:var(--line)}.lg.seg{border:1px dashed var(--ink-2)}
.yeargrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ym{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink-2);text-transform:capitalize;font-size:14px}
.ym.has{color:var(--ink);background:var(--glass-strong)}
.ym.has b{color:var(--accent)}
.ym.cur{border-color:var(--accent)}
@media (max-width:640px){
  .cal{gap:3px}
  .day{min-height:58px;padding:4px 3px;border-radius:10px;gap:3px}
  .calchip,.calseg{padding:0;height:7px;border-radius:4px}
  .calchip span,.calseg span{display:none}
  .calseg{border-style:solid;border-color:var(--ink-2);height:5px}
  .yeargrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .top{padding:10px 10px 10px 16px}
  .top .mlogo{display:block;font-family:var(--f-display);font-weight:900;font-size:22px;text-decoration:none;color:var(--ink)}
  .top .mlogo b{color:var(--accent)}
  .top h1{font-size:17px}
  .top .addtop{display:none}
  .mob{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;justify-content:space-around;align-items:center;padding:8px 6px}
  .mob a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-2);text-decoration:none;padding:4px 4px;border-radius:12px;min-width:0}
  .mob a[aria-current="page"]{color:var(--accent)}
  .mob svg{width:22px;height:22px}
  .mob .add{width:54px;height:54px;border-radius:50%;margin-top:-26px;padding:0}
  .mob .add svg{width:26px;height:26px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .rowcard{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .doc{padding:26px 20px}
  .hero .names{font-size:24px}
}
@media (max-width:520px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:32px}.panel{padding:18px}.bar{grid-template-columns:90px minmax(0,1fr) auto}}


/* acceso, menú de usuario, equipo y lector de PDF */

.gate-box{width:min(420px,100%);padding:30px 28px;display:flex;flex-direction:column;gap:22px;border-radius:28px}
.gate-box h2{font-size:22px}

.gate-logo .mark{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:1}

.gate-logo .sub{font-weight:300;font-size:24px;letter-spacing:.06em;line-height:1;margin-top:2px}
.gate-note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.gate-aviso{margin:0;padding:10px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.userbtn{gap:8px;padding:4px 12px 4px 4px;height:40px}
.userbtn .un{max-width:150px;overflow:hidden;text-overflow:ellipsis}

.umenu{position:absolute;right:10px;top:calc(100% + 8px);width:min(290px,calc(100vw - 32px));padding:10px;border-radius:20px;background:var(--glass-strong);display:flex;flex-direction:column;gap:2px;z-index:30}
.umenu a,.umenu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:12px;border:0;background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-weight:500;cursor:pointer}
.umenu a:hover,.umenu button:hover{background:var(--accent-soft)}
.umenu .danger{color:var(--bad)}
.um-head{display:flex;gap:10px;align-items:center;padding:6px 6px 10px}
.um-head .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um-head .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.um-sep{height:1px;background:var(--line);margin:4px 6px}
table.perm th:not(:first-child),table.perm td:not(:first-child){text-align:center}
table.perm th{white-space:normal;min-width:84px;vertical-align:bottom}
table.perm input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
table.dbt td{white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;font-size:14px}
table.dbt tr.dbjson td{white-space:normal;max-width:none;background:var(--glass-strong)}
table.dbt pre{margin:0;max-height:360px;overflow:auto;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.temp-card{display:grid;gap:10px;padding:14px 16px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.temp-card div{display:flex;flex-direction:column;gap:2px}
.pdfdrop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:26px 18px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:20px;cursor:pointer;background:var(--field);transition:background .15s}
.pdfdrop:hover,.pdfdrop.over{background:var(--accent-soft)}
.pdfdrop .big-ico{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--accent);line-height:1}
.pdfstate{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pdfstate .grow{flex:1;min-width:200px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.momento{padding:12px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line)}
.momento .f input{font-weight:600}
.songs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.songs .check{align-items:flex-start;font-weight:400}
.songs input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.pet-nota{display:block;font-size:12px;color:var(--muted);padding:2px 10px 0}
@media (max-width:860px){.userbtn .un{display:none}.userbtn{padding:4px}}

@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;box-shadow:none;border:0;max-width:none}
  .blobs{display:none}
  :root{--paper:#fff;--paper-ink:#000}
}

/* ============ cálculos ============ */
const packDe = b => A.packs.find(p => p.id === b.packId) || A.packs[0] || { id: "", nombre: "Sin pack", precio: 0, incluye: "" };
const packNivel = b => Math.max(0, A.packs.findIndex(p => p.id === b.packId));
const pv = (v, d) => (v === null || v === undefined || v === "") ? d : num(v);
function calc(b) {
  const P = b.presupuesto, pr = P.precios || {}, p = packDe(b), out = [];
  out.push({ auto: "pack", concepto: p.nombre + (b.packProvisional ? " (provisional)" : ""), cantidad: 1, precio: pv(pr.pack, p.precio), def: p.precio });
  if (b.happyMoment) out.push({ auto: "hm", concepto: "Happy moment", cantidad: 1, precio: pv(pr.hm, A.precios.happyMoment), def: A.precios.happyMoment });
  const hDj = b.djs.reduce((s, d) => s + num(d.horasExtra), 0), hAux = b.auxiliares.reduce((s, d) => s + num(d.horasExtra), 0);
  if (hDj) out.push({ auto: "hdj", concepto: "Horas extra DJ", cantidad: hDj, precio: pv(pr.hdj, A.precios.horaExtraDj), def: A.precios.horaExtraDj });
  if (hAux) out.push({ auto: "haux", concepto: "Horas extra auxiliares", cantidad: hAux, precio: pv(pr.haux, A.precios.horaExtraAux), def: A.precios.horaExtraAux });
  const auxExtra = Math.max(0, b.auxiliares.length - num(A.auxIncluidos)), djExtra = Math.max(0, b.djs.length - num(A.djsIncluidos));
  if (auxExtra) out.push({ auto: "auxextra", concepto: `Auxiliar adicional (incluidos ${num(A.auxIncluidos)})`, cantidad: auxExtra, precio: pv(pr.auxextra, A.precios.auxiliarExtra), def: A.precios.auxiliarExtra });
  if (djExtra) out.push({ auto: "djextra", concepto: `DJ adicional (incluido${num(A.djsIncluidos) === 1 ? "" : "s"} ${num(A.djsIncluidos)})`, cantidad: djExtra, precio: pv(pr.djextra, A.precios.djExtra), def: A.precios.djExtra });
  const subtotal = out.reduce((s, l) => s + l.cantidad * l.precio, 0) + P.lineas.reduce((s, l) => s + num(l.cantidad) * num(l.precio), 0);
  const base = Math.max(0, subtotal - num(P.descuento));
  const iva = base * num(P.iva) / 100, total = base + iva;
  const pagado = P.pagos.reduce((s, x) => s + num(x.importe), 0);
  return { auto: out, subtotal, base, iva, total, pagado, pendiente: total - pagado, hDj, hAux };
}
const cancion = b => Math.max(num(b.playlist.canciones), b.peticiones.length);
const activa = b => b.estado !== "Cancelada";
const pendienteDeBoda = b => activa(b) && b.estado !== "Celebrada" && (!b.fecha || dias(b.fecha) >= 0);

function siguienteSeguimiento(b, desde) {
  let n = addMonths(desde || hoy(), Math.max(1, num(b.seguimiento.frecuencia) || 1));
  if (b.fecha && n >= b.fecha) { const antes = addDays(b.fecha, -7); n = antes > hoy() ? antes : ""; }
  return n;
}

function avisos() {
  const out = [], lim = num(A.avisoDias) || 7;
  for (const b of lista()) {
    if (!pendienteDeBoda(b)) continue;
    const s = b.seguimiento.proximo;
    if (s && segActivo(b)) { const d = dias(s); if (d <= lim) out.push({ b, k: "seg", sev: d < 0 ? "bad" : d === 0 ? "acc" : "warn", fecha: s, d, t: d < 0 ? `Seguimiento vencido hace ${-d} ${-d === 1 ? "día" : "días"}` : d === 0 ? "Seguimiento para hoy" : `Seguimiento en ${d} ${d === 1 ? "día" : "días"}` }); }
    if (b.fecha) {
      const d = dias(b.fecha), c = calc(b);
      if (d >= 0 && d <= 30) out.push({ b, k: "boda", sev: "acc", fecha: b.fecha, d, t: d === 0 ? "La boda es hoy" : `La boda es en ${d} ${d === 1 ? "día" : "días"}` });
      if (b.packProvisional && d >= 0 && d <= 90) out.push({ b, k: "pack", sev: "warn", fecha: b.fecha, d, t: "Pack todavía provisional" });
      if (d >= 0 && d <= 14 && c.pendiente > 0.5 && puede("economico")) out.push({ b, k: "pago", sev: "warn", fecha: b.fecha, d, t: `Quedan ${eur(c.pendiente)} por cobrar` });
    }
    if (b.fecha && dias(b.fecha) >= 0) for (const c of conflictosBoda(b)) out.push({ b, k: "equipo", sev: "bad", fecha: b.fecha, d: dias(b.fecha), t: `${c.nombre}: ${c.e.tipo === "ausente" ? textoEstado(c.e).toLowerCase() : "tiene otra boda ese día (" + c.e.bodas.map(nombreCorto).join(", ") + ")"}` });
    const inc = b.incidencias.filter(i => i.estado !== "Resuelta").length;
    if (inc) out.push({ b, k: "inc", sev: "bad", fecha: b.fecha, d: 999, t: `${inc} ${inc === 1 ? "incidencia abierta" : "incidencias abiertas"}` });
  }
  const ord = { bad: 0, acc: 1, warn: 2 };
  return out.sort((x, y) => (ord[x.sev] - ord[y.sev]) || (x.d - y.d));
}

const LS_KEY = "izone-crm-v1";

function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }

function programar(path, getData) {
  store.dirty.add(path); store.ver[path] = (store.ver[path] || 0) + 1; const v = store.ver[path];
  clearTimeout(store.timers[path]);
  store.timers[path] = setTimeout(() => escribir(path, getData, v), 600);
}
function escribir(path, getData, v) {
  delete store.timers[path];
  const data = clone(getData());
  store.chains[path] = (store.chains[path] || Promise.resolve()).then(async () => {
    const t = new Date().toISOString();
    if (path === "ajustes/general") { const { error } = await sb.from("ajustes").upsert({ id: "general", data, actualizado: t }); if (error) throw error; return; }
    const id = path.slice(6), { main, eco } = separar(data);
    const r1 = await sb.from("bodas").upsert({ id, data: main, actualizado: t }); if (r1.error) throw r1.error;
    store.main[id] = main;
    if (puede("economico")) { const r2 = await sb.from("bodas_economico").upsert({ boda_id: id, data: eco, actualizado: t }); if (r2.error) throw r2.error; store.eco[id] = eco; }
  }).then(() => { if (store.ver[path] === v && !store.timers[path]) store.dirty.delete(path); })
    .catch(e => toast("No se pudo guardar: " + errTxt(e)));
}
function separar(b) { const c = clone(b); const eco = { presupuesto: c.presupuesto, contrato: c.contrato }; delete c.presupuesto; delete c.contrato; return { main: c, eco }; }
function componer(id) {
  const m = store.main[id]; if (!m) return null;
  const b = normalizar(Object.assign(clone(m), clone(store.eco[id] || {})), id), P = b.presupuesto;
  /* Punto de partida para detectar cambios en el presupuesto */
  if (store.eco[id]) { const t = Math.round(calc(b).total * 100) / 100; if (P.ultimoTotal == null) P.ultimoTotal = t; if (P.estado === "Aceptado" && P.totalAceptado == null) P.totalAceptado = t; }
  return b;
}
function guardarBoda(b) { registrarCambioPresupuesto(b); store.bodas[b.id] = b; const id = b.id; programar("bodas/" + id, () => store.bodas[id]); }
function guardarAjustes() { programar("ajustes/general", () => A); }
async function borrarBoda(id) {
  const path = "bodas/" + id; clearTimeout(store.timers[path]); delete store.timers[path]; store.dirty.delete(path);
  delete store.bodas[id]; delete store.main[id]; delete store.eco[id];
  const { error } = await sb.from("bodas").delete().eq("id", id);

async function iniciar() {

    sb.from("bodas").select("id,data"),

    .on("postgres_changes", { event: "*", schema: "public", table: "ajustes" }, p => { if (!store.dirty.has("ajustes/general") && p.new && p.new.data) { A = merge(clone(AJUSTES_DEF), p.new.data); render(); } })
    .on("postgres_changes", { event: "*", schema: "public", table: "perfiles" }, seg)

    .on("postgres_changes", { event: "*", schema: "public", table: "llamadas" }, p => { const id = (p.new && p.new.id) || (p.old && p.old.id); if (!id || llTimers[id]) return; if (p.eventType === "DELETE") delete store.llamadas[id]; else store.llamadas[id] = merge(llamadaVacia(), p.new.data); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "reuniones" }, () => { if (esAdmin()) cargarReuniones(); })
    .subscribe();
}
function cambio(tipo, p) {

function dbCsv(t) {

/* Admite la copia completa (versión 2) y la copia antigua de Ajustes (bodas + ajustes) */
function dbLeerCopia(d) {
  if (!d || d.app !== "izone-crm") throw new Error("no es una copia del CRM");
  if (d.tablas) {
    const T = d.tablas;
    return { bodas: (T.bodas || []).filter(r => r && r.id && r.data), eco: (T.bodas_economico || []).filter(r => r && r.boda_id && r.data), ajustes: (T.ajustes || []).filter(r => r && r.id && r.data), roles: (T.roles || []).filter(r => r && r.id && r.id !== "admin"), fecha: d.fecha };
  }
  const bodas = [], eco = [];
  for (const id in (d.bodas || {})) { const s = separar(normalizar(d.bodas[id], id)); bodas.push({ id, data: s.main }); eco.push({ boda_id: id, data: s.eco }); }
  return { bodas, eco, ajustes: d.ajustes ? [{ id: "general", data: d.ajustes }] : [], roles: [], fecha: d.fecha };
}
async function dbRestaurar(c) {
  const lote = async (tabla, filas, conflicto) => { for (let i = 0; i < filas.length; i += 200) { const { error } = await sb.from(tabla).upsert(filas.slice(i, i + 200), { onConflict: conflicto }); if (error) throw error; } };
  try {
    await lote("bodas", c.bodas.map(r => ({ id: r.id, data: r.data })), "id");
    await lote("bodas_economico", c.eco.filter(r => c.bodas.some(b => b.id === r.boda_id) || store.main[r.boda_id]).map(r => ({ boda_id: r.boda_id, data: r.data })), "boda_id");
    await lote("ajustes", c.ajustes.map(r => ({ id: r.id, data: r.data })), "id");
    await lote("roles", c.roles.map(r => ({ id: r.id, nombre: r.nombre || "Rol", secciones: r.secciones || [], orden: r.orden || 1 })), "id");
    await Promise.all([cargarDatos(), cargarSeguridad()]); await cargarBaseDatos();
    toast(`Copia restaurada: ${c.bodas.length} bodas`);
  } catch (e) { toast("No se pudo restaurar: " + errTxt(e)); }
}

async function enviarFormSeg(id, f) {
  const g = k => (f.get(k) || "").toString().trim(), clave = (f.get("clave") || "").toString();
  const fail = m => { if (id === "form-setup" || id === "form-login") { ui.gateErr = m; ui.gateBusy = false; } else { ui.formErr = m; ui.formBusy = false; } render(); };
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  const emailUsado = e => Object.values(sec.perfiles).some(p => (p.email || "").toLowerCase() === e);
  if (id === "form-login") {
    ui.gateBusy = true; ui.gateErr = ""; render();
    const m = await entrar(g("email"), clave); ui.gateBusy = false; ui.gateErr = m; render();
    if (m) { const c = document.getElementById("g-clave"); if (c) { c.value = ""; c.focus(); } }
    return;
  }
  if (id === "form-setup") {
    const email = g("email").toLowerCase();
    if (!g("nombre")) return fail("Escribe tu nombre.");
    if (!emailOk(email)) return fail("Escribe un correo válido.");
    if (clave.length < 8) return fail("La contraseña debe tener al menos 8 caracteres.");
    if (clave !== f.get("clave2")) return fail("Las contraseñas no coinciden.");
    ui.gateBusy = true; ui.gateErr = ""; render();
    try { await funcionAdmin({ accion: "bootstrap", email, password: clave, nombre: g("nombre") }); } catch (e) { return fail("No se pudo crear: " + e.message); }
    sec.hayUsuarios = true;
    const m = await entrar(email, clave); ui.gateBusy = false; ui.gateErr = m; render();
    if (!m) toast("Cuenta de administrador creada");
    return;
  }
  if (ui.formBusy) return;
  if (id === "form-clave") {
    const target = ui.claveDe, mia = sec.yo && sec.yo.id === target;
    if (clave.length < 8) return fail("La contraseña debe tener al menos 8 caracteres.");
    if (clave !== f.get("clave2")) return fail("Las contraseñas no coinciden.");
    ui.formBusy = true; ui.formErr = ""; render();
    try {
      if (mia) {
        const { error: e1 } = await sb.auth.signInWithPassword({ email: sec.yo.email, password: (f.get("actual") || "").toString() });
        if (e1) return fail("La contraseña actual no es correcta.");

      } else await funcionAdmin({ accion: "clave", id: target, password: clave });
    } catch (e) { return fail("No se pudo guardar: " + errTxt(e)); }
    ui.formBusy = false; ui.modal = null; ui.formErr = ""; render(); toast("Contraseña cambiada"); return;
  }
  if (!esAdmin()) return fail("Solo un administrador puede hacer esto.");
  if (id === "form-usuario") {
    const email = g("email").toLowerCase(), rol = g("rol");

    if (!emailOk(email)) return fail("Escribe un correo válido.");
    if (emailUsado(email)) return fail("Ya hay alguien con ese correo.");

  }

    const email = g("email").toLowerCase(), desde = new Date(g("desde")), hasta = new Date(g("hasta"));
    if (!g("nombre")) return fail("Escribe para quién es.");

  }

function vista() {

  switch (ui.ruta) {
    case "equipo": return err + vistaEquipo();
    case "accesos": return err + vistaAccesos();
    case "datos": return vistaBaseDatos();
    case "bodas": return err + vistaBodas();
    case "boda": return err + vistaBoda();
    case "estadisticas": return err + vistaStats();

/* ---------- Panel ---------- */
function vistaPanel() {
  const L = lista();
  if (!L.length) return `<section class="panel glass empty"><div class="big">0</div><h2>Todavía no hay bodas</h2><p class="muted" style="max-width:46ch">Pulsa «Añadir boda» para registrar la primera. Al guardarla se preparan el presupuesto y el contrato con los datos de los novios.</p><div class="row" style="justify-content:center"><button class="btn btn-primary" data-act="nueva" type="button">${ICON.plus}Añadir boda</button><button class="btn" data-act="ejemplos" type="button">Cargar bodas de ejemplo</button></div></section>`;
  const prox = L.filter(pendienteDeBoda);
  const prox90 = prox.filter(b => b.fecha && dias(b.fecha) <= 90).length;
  const av = avisos(); const segs = av.filter(a => a.k === "seg" && a.d <= 0).length;
  const inc = L.reduce((s, b) => s + b.incidencias.filter(i => i.estado !== "Resuelta").length, 0);
  const anio = String(new Date().getFullYear() + (new Date().getMonth() >= 9 ? 1 : 0));
  const fact = L.filter(b => activa(b) && (b.fecha || "").startsWith(anio)).reduce((s, b) => s + calc(b).total, 0);
  const ej = L.filter(b => b.ejemplo).length;
  return `
  ${ej ? `<section class="banner glass"><span class="chip warn">Ejemplo</span><div class="grow">Hay ${ej} bodas de ejemplo para que veas cómo funciona el CRM. Bórralas cuando empieces con las tuyas.</div><button class="btn btn-sm" data-act="borrar-ejemplos" type="button">Borrar ejemplos</button></section>` : ""}
  <section class="grid g4">
    <div class="kpi glass"><span class="v tab-num">${prox90}</span><span class="l">Bodas en los próximos 90 días</span></div>
    <div class="kpi glass ${segs ? "alert" : ""}"><span class="v tab-num">${segs}</span><span class="l">Seguimientos para hoy o atrasados</span></div>
    <div class="kpi glass ${inc ? "alert" : ""}"><span class="v tab-num">${inc}</span><span class="l">Incidencias abiertas</span></div>
    ${puede("economico") ? `<div class="kpi glass"><span class="v small tab-num">${eur(fact)}</span><span class="l">Presupuestado para ${anio}</span></div>` : ""}
  </section>
  <section class="grid g2" style="align-items:start">
    ${vistaAvisos(false)}
    <div class="panel glass"><h2 class="sec-h">Próximas bodas<span class="spacer"></span><a class="btn btn-sm btn-ghost" href="#bodas">Ver todas</a></h2>
      <div class="list">${prox.slice(0, 7).map(filaBoda).join("") || `<p class="muted">No hay bodas próximas.</p>`}</div>
    </div>
  </section>`;
}
function datebox(s) { if (!s) return `<div class="datebox"><div class="d">?</div><div class="m">fecha</div></div>`; const d = parse(s); return `<div class="datebox"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString("es-ES", { month: "short" }).replace(".", "")}</div><div class="y">${d.getFullYear()}</div></div>`; }
function filaBoda(b) {

  return `<a class="item" href="#boda-${b.id}" style="text-decoration:none;color:inherit">${datebox(b.fecha)}<div class="grow"><div class="t">${esc(nombres(b))}</div><div class="s">${esc(b.lugar.nombre || "Lugar sin definir")} · ${esc(packDe(b).nombre)}${b.packProvisional ? " (provisional)" : ""}</div></div>${d != null && d >= 0 ? `<span class="chip line tab-num">${d === 0 ? "hoy" : d + " d"}</span>` : ""}</a>`;
}
function vistaAvisos(full) {

  const shown = full ? items : items.slice(0, 8);
  return `<div class="panel glass"><h2 class="sec-h">Avisos y seguimientos<span class="spacer"></span>${!full && items.length > 8 ? `<a class="btn btn-sm btn-ghost" href="#avisos">Ver los ${items.length}</a>` : ""}</h2>

/* ---------- Lista de bodas ---------- */
function vistaBodas() {
  const filtros = [["proximas", "Próximas"], ["sincerrar", "Sin cerrar"], ["cerradas", "Cerradas"], ["todas", "Todas"], ["provisional", "Pack provisional"], ["celebradas", "Celebradas"], ["canceladas", "Canceladas"]];

function estadoChip(b) { const m = { Llamada: "line", "Presupuesto enviado": "warn", Reservada: "acc", Cerrada: "ok", Confirmada: "ok", Celebrada: "line", Cancelada: "bad" }; return `<span class="chip ${m[b.estado] || ""}">${esc(b.estado)}</span>`; }

/* ---------- Detalle de boda ---------- */
const inp = (path, label, type = "text", extra = "") => `<label class="f ${extra.includes("wide") ? "wide" : ""}"><span>${label}</span><input type="${type}" id="${fid("b", path)}" data-b="${path}" value="${esc(getPath(bodaActual(), path) ?? "")}" ${type === "number" ? 'min="0" step="any" inputmode="decimal"' : ""} ${extra.replace("wide", "")}></label>`;
const area = (path, label, rows = 3, ph = "") => `<label class="f wide"><span>${label}</span><textarea id="${fid("b", path)}" data-b="${path}" rows="${rows}" placeholder="${esc(ph)}">${esc(getPath(bodaActual(), path) ?? "")}</textarea></label>`;
const sel = (path, label, opts, attr = "data-b") => { const v = getPath(bodaActual(), path); return `<label class="f"><span>${label}</span><select id="${fid("b", path)}" ${attr}="${path}">${opts.map(o => { const [val, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select></label>`; };

  if (!tabs.some(([k]) => k === ui.tab)) ui.tab = "resumen";

/* ---------- Calendario ---------- */
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function vistaCalendario() {
  const [y, m] = ui.cal.split("-").map(Number);
  const first = new Date(y, m - 1, 1), offset = (first.getDay() + 6) % 7, nDias = new Date(y, m, 0).getDate();
  const semanas = Math.ceil((offset + nDias) / 7), H = hoy();
  const contratadas = lista().filter(b => activa(b) && b.fecha && (ui.calTodas || cerrada(b)));
  const porDia = {}; for (const b of contratadas) (porDia[b.fecha] = porDia[b.fecha] || []).push(b);
  const segDia = {}; if (ui.calSeg) for (const b of lista().filter(segActivo)) if (b.seguimiento.proximo) (segDia[b.seguimiento.proximo] = segDia[b.seguimiento.proximo] || []).push(b);
  const delMes = contratadas.filter(b => b.fecha.startsWith(ui.cal));
  const prev = addMonths(ui.cal + "-01", -1).slice(0, 7), next = addMonths(ui.cal + "-01", 1).slice(0, 7);
  const cls = b => b.estado === "Cerrada" ? "conf" : b.estado === "Celebrada" ? "done" : "res";
  let celdas = "";
  for (let i = 0; i < semanas * 7; i++) {
    const d = new Date(y, m - 1, 1 - offset + i), k = ymd(d), fuera = d.getMonth() !== m - 1;
    const bs = porDia[k] || [], ss = segDia[k] || [];
    celdas += `<div class="day ${fuera ? "out" : ""} ${k === H ? "today" : ""} ${bs.length ? "has" : ""}"><span class="dn tab-num">${d.getDate()}</span>
      ${bs.map(b => `<a class="calchip ${cls(b)}" href="#boda-${b.id}" title="${esc(nombres(b))} · ${esc(b.estado)} · ${esc(b.lugar.nombre || "")}"><span>${esc(nombreCorto(b))}</span></a>`).join("")}
      ${ss.map(b => `<a class="calseg" href="#boda-${b.id}" data-tab="seguimiento" title="Seguimiento de ${esc(nombres(b))}"><span>Seguimiento ${esc(nombreCorto(b))}</span></a>`).join("")}</div>`;
  }
  const anioCount = MESES.map((mm, i) => { const k = `${y}-${String(i + 1).padStart(2, "0")}`; return [k, mm, contratadas.filter(b => b.fecha.startsWith(k)).length]; });
  return `<section class="panel glass" style="padding:14px 16px"><div class="row">
      <a class="btn btn-sm iconbtn" href="#cal-${prev}" aria-label="Mes anterior" style="width:36px;height:36px">${ICON.back}</a>
      <h2 style="font-size:20px;min-width:180px;text-align:center;text-transform:capitalize">${MESES[m - 1]} ${y}</h2>
      <a class="btn btn-sm iconbtn" href="#cal-${next}" aria-label="Mes siguiente" style="width:36px;height:36px;transform:scaleX(-1)">${ICON.back}</a>
      <a class="btn btn-sm" href="#cal-${H.slice(0, 7)}">Hoy</a>
      <span style="flex:1"></span>
      <label class="check" style="font-size:14px"><input type="checkbox" class="switch" id="cal-todas" data-caltodas="1" ${ui.calTodas ? "checked" : ""}>Ver también las no cerradas</label>
      <label class="check" style="font-size:14px"><input type="checkbox" class="switch" id="cal-seg" data-calseg="1" ${ui.calSeg ? "checked" : ""}>Ver seguimientos</label>
    </div>
    <div class="row cal-legend" style="margin-top:10px;gap:14px;font-size:13px"><span><i class="lg conf"></i>Cerrada</span><span><i class="lg done"></i>Celebrada</span>${ui.calTodas ? `<span><i class="lg res"></i>Sin cerrar (llamada, presupuesto, reservada)</span>` : `<span class="muted">Solo se ven las bodas cerradas.</span>`}${ui.calSeg ? `<span><i class="lg seg"></i>Seguimiento</span>` : ""}</div></section>
  <section class="panel glass" style="padding:14px">
    <div class="cal cal-head">${["lun", "mar", "mié", "jue", "vie", "sáb", "dom"].map(d => `<span>${d}</span>`).join("")}</div>
    <div class="cal">${celdas}</div></section>
  <section class="grid g2" style="align-items:start">
    <div class="panel glass"><h2 class="sec-h">Bodas de ${MESES[m - 1]}<span class="chip line">${delMes.length}</span></h2>
      <div class="list">${delMes.map(filaBoda).join("") || `<p class="muted">No hay bodas contratadas este mes.</p>`}</div></div>
    <div class="panel glass"><h2 class="sec-h">Año ${y}<span class="chip line">${anioCount.reduce((s, x) => s + x[2], 0)} bodas</span></h2>
      <div class="yeargrid">${anioCount.map(([k, mm, n]) => `<a class="ym ${k === ui.cal ? "cur" : ""} ${n ? "has" : ""}" href="#cal-${k}"><span>${mm.slice(0, 3)}</span><b class="tab-num">${n}</b></a>`).join("")}</div>
      <div class="row" style="margin-top:12px;justify-content:space-between"><a class="btn btn-sm btn-ghost" href="#cal-${y - 1}-${String(m).padStart(2, "0")}">${y - 1}</a><a class="btn btn-sm btn-ghost" href="#cal-${y + 1}-${String(m).padStart(2, "0")}">${y + 1}</a></div></div>
  </section>`;
}
/* ---------- Estadísticas ---------- */
function contar(arr, key) { const m = new Map(); for (const x of arr) { const k = key(x); if (!k) continue; const kk = k.trim(); if (!kk) continue; const id = kk.toLowerCase(); const e = m.get(id) || { l: kk, n: 0 }; e.n++; m.set(id, e); } return [...m.values()].sort((a, b) => b.n - a.n); }
function barras(rows, fmt = v => v) { const max = Math.max(1, ...rows.map(r => r.n)); return rows.length ? `<div class="bars">${rows.map(r => `<div class="bar" title="${esc(r.l)}: ${esc(fmt(r.n))}"><span class="lab">${esc(r.l)}</span><span class="track"><span class="fill" style="display:block;width:${(r.n / max * 100).toFixed(1)}%"></span></span><span class="val">${esc(fmt(r.n))}</span></div>`).join("")}</div>` : `<p class="muted">Sin datos todavía.</p>`; }
function vistaStats() {
  const todas = lista().filter(activa);
  const anios = [...new Set(todas.map(b => (b.fecha || "").slice(0, 4)).filter(Boolean))].sort();
  const L = ui.anio === "todos" ? todas : todas.filter(b => (b.fecha || "").startsWith(ui.anio));
  if (!todas.length) return `<section class="panel glass empty"><h2>Sin datos todavía</h2><p class="muted">Las estadísticas aparecen al añadir bodas.</p></section>`;
  const lugares = contar(L, b => b.lugar.nombre);
  const mayorPack = L.slice().sort((a, b) => packNivel(b) - packNivel(a) || calc(b).total - calc(a).total)[0];
  const mayorTotal = L.slice().sort((a, b) => calc(b).total - calc(a).total)[0];
  const playlist = L.slice().sort((a, b) => cancion(b) - cancion(a))[0];
  const canales = contar(L, b => b.captacion.canal);
  const wps = contar(L.filter(b => b.captacion.canal === "Wedding planner"), b => b.captacion.detalle);
  const djs = contar(L.flatMap(b => b.djs), d => d.nombre);
  const packs = A.packs.map(p => ({ l: p.nombre, n: L.filter(b => b.packId === p.id).length }));
  const hm = L.filter(b => b.happyMoment).length;
  const total = L.reduce((s, b) => s + calc(b).total, 0), cobrado = L.reduce((s, b) => s + calc(b).pagado, 0);
  const horas = L.reduce((s, b) => { const c = calc(b); return s + c.hDj + c.hAux; }, 0);
  const meses = new Map(); for (const b of L) if (b.fecha) { const k = b.fecha.slice(0, 7); meses.set(k, (meses.get(k) || 0) + 1); }
  const mk = [...meses.keys()].sort(); let cols = [];
  if (mk.length) { let k = mk[0]; const fin = mk[mk.length - 1]; let guard = 0; while (k <= fin && guard++ < 60) { cols.push([k, meses.get(k) || 0]); k = addMonths(k + "-01", 1).slice(0, 7); } }
  const maxM = Math.max(1, ...cols.map(c => c[1]));
  const tile = (eb, big, sub) => `<div class="kpi glass"><span class="eyebrow">${eb}</span><span class="stat-big">${big}</span><span class="muted" style="font-size:13.5px">${sub}</span></div>`;
  return `<section class="panel glass" style="padding:14px 16px"><div class="row"><span class="eyebrow">Periodo</span>${["todos", ...anios].map(a => `<button class="chipbtn" type="button" data-act="anio" data-v="${a}" aria-pressed="${ui.anio === a}">${a === "todos" ? "Todas las bodas" : a}</button>`).join("")}<span style="flex:1"></span><span class="muted" style="font-size:13.5px">${L.length} bodas (sin contar canceladas)</span></div></section>
  <section class="grid g4">
    <div class="kpi glass"><span class="v tab-num">${L.length}</span><span class="l">Bodas</span></div>
    <div class="kpi glass"><span class="v small tab-num">${eur(total)}</span><span class="l">Facturación presupuestada · cobrado ${eur(cobrado)}</span></div>
    <div class="kpi glass"><span class="v small tab-num">${eur(L.length ? total / L.length : 0)}</span><span class="l">Presupuesto medio por boda</span></div>
    <div class="kpi glass"><span class="v tab-num">${L.length ? Math.round(hm / L.length * 100) : 0}%</span><span class="l">Con happy moment (${hm})</span></div>
  </section>
  <section class="grid g3">
    ${tile("Lugar con más bodas", esc(lugares[0] ? lugares[0].l : "—"), lugares[0] ? `${lugares[0].n} ${lugares[0].n === 1 ? "boda" : "bodas"}` : "")}
    ${tile("Boda con mayor pack", mayorPack ? `<a href="#boda-${mayorPack.id}" style="color:inherit">${esc(nombres(mayorPack))}</a>` : "—", mayorPack ? `${esc(packDe(mayorPack).nombre)} · ${eur(calc(mayorPack).total)}` : "")}
    ${tile("Playlist con más canciones", playlist && cancion(playlist) ? `<a href="#boda-${playlist.id}" style="color:inherit">${esc(nombres(playlist))}</a>` : "—", playlist && cancion(playlist) ? `${cancion(playlist)} canciones` : "")}
    ${tile("Presupuesto más alto", mayorTotal ? `<a href="#boda-${mayorTotal.id}" style="color:inherit">${esc(nombres(mayorTotal))}</a>` : "—", mayorTotal ? eur(calc(mayorTotal).total) : "")}

    ${tile("Wedding planner con más bodas", esc(wps[0] ? wps[0].l : "—"), wps[0] ? `${wps[0].n} ${wps[0].n === 1 ? "boda" : "bodas"}` : "Ninguna boda por planner")}
    ${tile("DJ con más bodas", esc(djs[0] ? djs[0].l : "—"), djs[0] ? `${djs[0].n} ${djs[0].n === 1 ? "boda" : "bodas"}` : "")}

  </section>
  <section class="panel glass"><h2 class="sec-h">Bodas por mes</h2>
    ${cols.length ? `<div class="months">${cols.map(([k, n]) => `<div class="col" title="${esc(parse(k + "-01").toLocaleDateString("es-ES", { month: "long", year: "numeric" }))}: ${n} ${n === 1 ? "boda" : "bodas"}"><div class="colbar" style="height:${(n / maxM * 130).toFixed(0)}px">${n ? `<span>${n}</span>` : ""}</div><span>${parse(k + "-01").toLocaleDateString("es-ES", { month: "short" }).replace(".", "")}<br>${k.slice(2, 4)}</span></div>`).join("")}</div>` : `<p class="muted">Sin fechas.</p>`}</section>
  <section class="grid g2" style="align-items:start">
    <div class="panel glass"><h2 class="sec-h">Lugares</h2>${barras(lugares.slice(0, 8))}</div>

  </section>`;
}

/* ============ acciones ============ */
function val(el) {
  if (el.type === "checkbox") return el.checked;
  if (el.type === "number") { if (el.value === "") return el.dataset.null ? null : 0; return Number(el.value); }
  return el.value;
}
let toastT;
function toast(t) { const n = $("#toast"); n.textContent = t; n.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => n.hidden = true, 2600); }
function confirmar(titulo, texto, boton, fn) { ui.confirm = { titulo, texto, boton, fn }; ui.modal = "confirm"; render(); setTimeout(() => { const b = $("#btn-confirmar"); b && b.focus(); }, 0); }
function cambiarPack(b, nuevo) {
  if (b.packId === nuevo) return;
  const antes = calc(b).total, de = packDe(b).nombre;
  b.packId = nuevo; b.presupuesto.precios.pack = null;
  b.presupuesto.historial.push({ fecha: hoy(), de, a: packDe(b).nombre, totalAntes: antes, totalDespues: calc(b).total }); b.presupuesto.ultimoTotal = Math.round(calc(b).total * 100) / 100;
  guardarBoda(b); toast(`Presupuesto convertido a ${packDe(b).nombre}`);
}
function segHecho(b, nota) {
  b.seguimiento.historial.push({ fecha: hoy(), nota: nota || "" });
  b.seguimiento.proximo = siguienteSeguimiento(b, hoy());
  guardarBoda(b);
  toast(b.seguimiento.proximo ? `Siguiente seguimiento: ${fecha(b.seguimiento.proximo)}` : "Seguimiento anotado");
}
async function descargar(nombre, tipo, texto) {
  if (store.downloads) { try { await store.downloads.save({ filename: nombre, data: new Blob([texto], { type: tipo }) }); return; } catch (e) { if (!(e && /cancel|declin|dismiss|denied/i.test(String(e.code || "")))) toast("No se pudo descargar" + (e && e.message ? ": " + e.message : "")); return; } }
  if (window.top !== window) { toast("Este visor no permite descargas. Abre el CRM en el navegador para descargar."); return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); } catch { toast("Este navegador no permite descargar"); }
}
function ics() {
  const st = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z"; const f = s => s.replace(/-/g, "");
  const e = (id, s, t, desc) => ["BEGIN:VEVENT", "UID:" + id + "@izone-crm", "DTSTAMP:" + st, "DTSTART;VALUE=DATE:" + f(s), "DTEND;VALUE=DATE:" + f(addDays(s, 1)), "SUMMARY:" + t.replace(/[,;]/g, " "), "DESCRIPTION:" + (desc || "").replace(/[,;\n]/g, " "), "END:VEVENT"].join("\r\n");
  const ev = [];
  for (const b of lista().filter(cerrada)) {
    if (b.fecha) ev.push(e("boda-" + b.id, b.fecha, "Boda " + nombres(b), (b.lugar.nombre || "") + " · " + packDe(b).nombre));
    if (b.seguimiento.proximo && segActivo(b)) ev.push(e("seg-" + b.id + "-" + b.seguimiento.proximo, b.seguimiento.proximo, "Seguimiento " + nombreCorto(b), "Seguimiento mensual IZONE"));
  }
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//IZONE EVENTS//CRM Bodas//ES", ...ev, "END:VCALENDAR"].join("\r\n");
}
function revisarNotificaciones() {
  try {
    if (store.mode !== "local" || !("Notification" in window) || Notification.permission !== "granted") return;
    const k = "izone-notif-" + hoy(); if (localStorage.getItem(k)) return;
    const n = avisos().filter(a => a.k === "seg" && a.d <= 0);
    if (n.length) new Notification("IZONE · Seguimientos pendientes", { body: n.map(a => nombreCorto(a.b)).join(", ") });
    localStorage.setItem(k, "1");
  } catch { }
}
